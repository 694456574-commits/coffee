<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☕ 我的咖啡账本</title>
    <!-- 引入 Tailwind CSS 进行样式设计 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 Supabase JS 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 引入 Chart.js 用于图表展示 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 隐藏滚动条但保留功能 */
        body { -webkit-font-smoothing: antialiased; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 底部导航栏安全区域适配 iPhone */
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

<div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
    
    <!-- 顶部标题 -->
    <header class="bg-amber-700 text-white p-4 sticky top-0 z-10 shadow-md">
        <h1 class="text-xl font-bold text-center">☕ 咖啡消费记账</h1>
    </header>

    <!-- 主内容区域 -->
    <main class="p-4">
        
        <!-- 1. 家庭咖啡支出 -->
        <div v-if="currentTab === 'home'" class="space-y-4">
            <h2 class="text-lg font-bold text-amber-800 mb-2">🏠 家庭自制记录</h2>
            
            <!-- 输入表单 -->
            <div class="bg-white p-4 rounded-lg shadow border border-amber-100">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input v-model="homeForm.date" type="date" class="p-2 border rounded bg-gray-50">
                    <input v-model="homeForm.total" type="number" placeholder="总金额" class="p-2 border rounded bg-gray-50">
                </div>
                <div class="grid grid-cols-3 gap-2 mb-3 text-sm">
                    <input v-model="homeForm.milk" type="number" placeholder="牛奶" class="p-2 border rounded text-center">
                    <input v-model="homeForm.bean" type="number" placeholder="豆子" class="p-2 border rounded text-center">
                    <input v-model="homeForm.supply" type="number" placeholder="耗材" class="p-2 border rounded text-center">
                </div>
                <button @click="addHomeRecord" class="w-full bg-amber-600 text-white py-2 rounded font-bold hover:bg-amber-700 transition">记一笔</button>
            </div>

            <!-- 统计图表 -->
            <div class="bg-white p-4 rounded-lg shadow mt-6">
                <h3 class="font-bold mb-2 text-center">支出占比</h3>
                <canvas id="homeChart"></canvas>
            </div>

            <!-- 列表 -->
            <div class="space-y-2 mt-4">
                <div v-for="item in homeRecords" :key="item.id" class="flex justify-between items-center p-3 bg-white rounded shadow-sm border-l-4 border-amber-500">
                    <div>
                        <div class="font-bold">{{ item.date }}</div>
                        <div class="text-xs text-gray-500">奶:{{item.milk_cost}} 豆:{{item.bean_cost}} 耗:{{item.supply_cost}}</div>
                    </div>
                    <div class="font-bold text-amber-700">¥{{ item.milk_cost + item.bean_cost + item.supply_cost }}</div>
                </div>
            </div>
        </div>

        <!-- 2. 日常咖啡支出 -->
        <div v-if="currentTab === 'daily'" class="space-y-4">
            <h2 class="text-lg font-bold text-blue-800 mb-2">🏢 日常连锁记录</h2>
            
            <div class="bg-white p-4 rounded-lg shadow border border-blue-100">
                <div class="flex gap-3 mb-3">
                    <input v-model="dailyForm.date" type="date" class="p-2 border rounded w-1/3 bg-gray-50">
                    <input v-model="dailyForm.amount" type="number" placeholder="金额" class="p-2 border rounded flex-1 bg-gray-50">
                </div>
                <button @click="addDailyRecord" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition">记一笔</button>
            </div>

            <!-- 统计 -->
            <div class="bg-white p-4 rounded-lg shadow mt-6">
                <h3 class="font-bold mb-2 text-center">每月分布</h3>
                <canvas id="dailyChart"></canvas>
            </div>

            <div class="space-y-2 mt-4">
                <div v-for="item in dailyRecords" :key="item.id" class="flex justify-between items-center p-3 bg-white rounded shadow-sm border-l-4 border-blue-500">
                    <div class="font-bold">{{ item.date }}</div>
                    <div class="font-bold text-blue-700">¥{{ item.amount }}</div>
                </div>
            </div>
        </div>

        <!-- 3. 探店咖啡支出 -->
        <div v-if="currentTab === 'explore'" class="space-y-4">
            <h2 class="text-lg font-bold text-purple-800 mb-2">✈️ 探店记录</h2>
            
            <div class="bg-white p-4 rounded-lg shadow border border-purple-100">
                <div class="space-y-3 mb-3">
                    <input v-model="exploreForm.date" type="date" class="w-full p-2 border rounded bg-gray-50">
                    <input v-model="exploreForm.city" type="text" placeholder="城市 (如: 上海)" class="w-full p-2 border rounded bg-gray-50">
                    <input v-model="exploreForm.amount" type="number" placeholder="金额" class="w-full p-2 border rounded bg-gray-50">
                </div>
                <button @click="addExploreRecord" class="w-full bg-purple-600 text-white py-2 rounded font-bold hover:bg-purple-700 transition">记一笔</button>
            </div>

            <!-- 统计 -->
            <div class="bg-white p-4 rounded-lg shadow mt-6">
                <h3 class="font-bold mb-2 text-center">城市分布</h3>
                <canvas id="exploreChart"></canvas>
            </div>

            <div class="space-y-2 mt-4">
                <div v-for="item in exploreRecords" :key="item.id" class="flex justify-between items-center p-3 bg-white rounded shadow-sm border-l-4 border-purple-500">
                    <div>
                        <div class="font-bold">{{ item.city }} <span class="text-xs font-normal text-gray-500">{{ item.date }}</span></div>
                    </div>
                    <div class="font-bold text-purple-700">¥{{ item.amount }}</div>
                </div>
            </div>
        </div>

    </main>

    <!-- 底部导航栏 -->
    <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 flex justify-around py-3 safe-bottom z-20">
        <button @click="currentTab = 'home'" :class="{'text-amber-600': currentTab === 'home', 'text-gray-400': currentTab !== 'home'}" class="flex flex-col items-center text-xs">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            家庭
        </button>
        <button @click="currentTab = 'daily'" :class="{'text-blue-600': currentTab === 'daily', 'text-gray-400': currentTab !== 'daily'}" class="flex flex-col items-center text-xs">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            日常
        </button>
        <button @click="currentTab = 'explore'" :class="{'text-purple-600': currentTab === 'explore', 'text-gray-400': currentTab !== 'explore'}" class="flex flex-col items-center text-xs">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            探店
        </button>
    </nav>
</div>

<script>
    // --- 核心配置：已填入你的密钥 ---
    // 请勿泄露此代码中的 URL 和 anon key
    const SUPABASE_URL = 'https://vwrflrdfiengymrdhcap.supabase.co'; // 你的项目地址
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3cmZscmRmaWVuZ3ltcmRoY2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NzQ0MDYsImV4cCI6MjA5MjI1MDQwNn0.auVTDC2GrQOG8cK70oi6T0S5Z3Zzoj7Zb8UsDTJAXwM'; // 你的公钥

    const { createClient } = supabase;

    // 创建 Supabase 客户端实例
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- Vue 3 应用逻辑 ---
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            // 当前选中的标签页
            const currentTab = ref('home');

            // 表单数据
            const homeForm = ref({ date: new Date().toISOString().split('T')[0], milk: 0, bean: 0, supply: 0 });
            const dailyForm = ref({ date: new Date().toISOString().split('T')[0], amount: 0 });
            const exploreForm = ref({ date: new Date().toISOString().split('T')[0], city: '', amount: 0 });

            // 表格数据
            const homeRecords = ref([]);
            const dailyRecords = ref([]);
            const exploreRecords = ref([]);

            // 图表实例
            let homeChart = null;
            let dailyChart = null;
            let exploreChart = null;

            // --- 数据库操作函数 ---

            // 1. 家庭咖啡
            const loadHomeRecords = async () => {
                const { data, error } = await supabaseClient
                    .from('home_coffee')
                    .select('*')
                    .order('date', { ascending: false });
                if (error) console.error('加载家庭记录失败:', error);
                else homeRecords.value = data;
                updateHomeChart(); // 加载完数据更新图表
            };

            const addHomeRecord = async () => {
                const { error } = await supabaseClient
                    .from('home_coffee')
                    .insert([{
                        date: homeForm.value.date,
                        milk_cost: homeForm.value.milk,
                        bean_cost: homeForm.value.bean,
                        supply_cost: homeForm.value.supply
                    }]);
                if (error) alert('保存失败: ' + error.message);
                else {
                    homeForm.value = { date: new Date().toISOString().split('T')[0], milk: 0, bean: 0, supply: 0 };
                    loadHomeRecords(); // 刷新列表
                }
            };

            // 2. 日常咖啡
            const loadDailyRecords = async () => {
                const { data, error } = await supabaseClient
                    .from('daily_coffee')
                    .select('*')
                    .order('date', { ascending: false });
                if (error) console.error('加载日常记录失败:', error);
                else dailyRecords.value = data;
                updateDailyChart();
            };

            const addDailyRecord = async () => {
                const { error } = await supabaseClient
                    .from('daily_coffee')
                    .insert([{
                        date: dailyForm.value.date,
                        amount: dailyForm.value.amount
                    }]);
                if (error) alert('保存失败: ' + error.message);
                else {
                    dailyForm.value = { date: new Date().toISOString().split('T')[0], amount: 0 };
                    loadDailyRecords();
                }
            };

            // 3. 探店咖啡
            const loadExploreRecords = async () => {
                const { data, error } = await supabaseClient
                    .from('explore_coffee')
                    .select('*')
                    .order('date', { ascending: false });
                if (error) console.error('加载探店记录失败:', error);
                else exploreRecords.value = data;
                updateExploreChart();
            };

            const addExploreRecord = async () => {
                const { error } = await supabaseClient
                    .from('explore_coffee')
                    .insert([{
                        date: exploreForm.value.date,
                        city: exploreForm.value.city,
                        amount: exploreForm.value.amount
                    }]);
                if (error) alert('保存失败: ' + error.message);
                else {
                    exploreForm.value = { date: new Date().toISOString().split('T')[0], city: '', amount: 0 };
                    loadExploreRecords();
                }
            };

            // --- 统计图表更新函数 ---

            // 更新家庭咖啡饼图
            const updateHomeChart = () => {
                // 销毁旧图表
                if (homeChart) homeChart.destroy();

                // 计算总和
                const totalMilk = homeRecords.value.reduce((sum, item) => sum + Number(item.milk_cost), 0);
                const totalBean = homeRecords.value.reduce((sum, item) => sum + Number(item.bean_cost), 0);
                const totalSupply = homeRecords.value.reduce((sum, item) => sum + Number(item.supply_cost), 0);

                // 获取 Canvas 上下文
                const ctx = document.getElementById('homeChart')?.getContext('2d');
                if (!ctx) return;

                // 创建新图表
                homeChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['牛奶', '咖啡豆', '耗材'],
                        datasets: [{
                            data: [totalMilk, totalBean, totalSupply],
                            backgroundColor: ['#fcd34d', '#78350f', '#9ca3af']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            };

            // 更新日常咖啡柱状图 (按月)
            const updateDailyChart = () => {
                if (dailyChart) dailyChart.destroy();

                // 按月份聚合数据
                const monthlyData = {};
                dailyRecords.value.forEach(item => {
                    const month = item.date.substring(0, 7); // 提取 '2023-10'
                    monthlyData[month] = (monthlyData[month] || 0) + Number(item.amount);
                });

                const labels = Object.keys(monthlyData).sort();
                const data = labels.map(label => monthlyData[label]);

                const ctx = document.getElementById('dailyChart')?.getContext('2d');
                if (!ctx) return;

                dailyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '月支出 (¥)',
                            data: data,
                            backgroundColor: '#3b82f6'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            };

            // 更新探店咖啡饼图 (按城市)
            const updateExploreChart = () => {
                if (exploreChart) exploreChart.destroy();

                const cityData = {};
                exploreRecords.value.forEach(item => {
                    cityData[item.city] = (cityData[item.city] || 0) + Number(item.amount);
                });

                const labels = Object.keys(cityData);
                const data = labels.map(city => cityData[city]);

                const ctx = document.getElementById('exploreChart')?.getContext('2d');
                if (!ctx) return;

                exploreChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: ['#8b5cf6', '#ec4899', '#10b981', '#f59e0b']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            };

            // --- 页面加载初始化 ---
            onMounted(async () => {
                console.log('应用启动，正在加载数据...');
                await loadHomeRecords();
                await loadDailyRecords();
                await loadExploreRecords();
            });

            return {
                currentTab,
                homeForm,
                dailyForm,
                exploreForm,
                homeRecords,
                dailyRecords,
                exploreRecords,
                addHomeRecord,
                addDailyRecord,
                addExploreRecord
            };
        }
    }).mount('#app');
</script>

</body>
</html>
